name: Assignment Portal CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      failure_demo:
        description: Send a deliberate failing-test report email
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, windows]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -m pip --version
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests and send report to localhost
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPORT_RECEIVER_URL: http://127.0.0.1:9000/report
          FAILURE_DEMO: ${{ inputs.failure_demo }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exitStatus = 1
          $receiver = $null

          $receiverPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "receiver\receiver.py"

          $receiverLog = Join-Path `
            $env:RUNNER_TEMP `
            "receiver.log"

          $receiverErrorLog = Join-Path `
            $env:RUNNER_TEMP `
            "receiver-error.log"

          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Receiver path: $receiverPath"
          Write-Host "Receiver output log: $receiverLog"
          Write-Host "Receiver error log: $receiverErrorLog"

          if (-not (Test-Path $receiverPath)) {
            Write-Host "Repository files:"

            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse |
              Select-Object FullName

            throw "Receiver file was not found: $receiverPath"
          }

          $pythonCommand = Get-Command python -ErrorAction Stop
          $pythonPath = $pythonCommand.Source

          Write-Host "Python executable: $pythonPath"
          & $pythonPath --version

          $receiver = Start-Process `
            -FilePath $pythonPath `
            -ArgumentList @("-u", $receiverPath) `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -PassThru `
            -RedirectStandardOutput $receiverLog `
            -RedirectStandardError $receiverErrorLog

          Write-Host "Receiver process ID: $($receiver.Id)"

          try {
            $receiverReady = $false

            for ($attempt = 1; $attempt -le 30; $attempt++) {
              Start-Sleep -Seconds 1

              if ($receiver.HasExited) {
                Write-Host "Receiver process exited with code $($receiver.ExitCode)."
                break
              }

              try {
                $healthResponse = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:9000/health" `
                  -Method Get `
                  -TimeoutSec 2

                Write-Host "Health response:"
                Write-Host ($healthResponse | Out-String)

                $receiverReady = $true
                break
              }
              catch {
                Write-Host "Waiting for receiver: attempt $attempt of 30"
              }
            }

            if (-not $receiverReady) {
              Write-Host "----- Receiver standard output -----"

              if (Test-Path $receiverLog) {
                Get-Content $receiverLog
              }
              else {
                Write-Host "Receiver output log was not created."
              }

              Write-Host "----- Receiver error output -----"

              if (Test-Path $receiverErrorLog) {
                Get-Content $receiverErrorLog
              }
              else {
                Write-Host "Receiver error log was not created."
              }

              throw "The local report receiver did not start."
            }

            Write-Host "Local report receiver started successfully."

            $pytestArgs = @(
              "-m",
              "pytest",
              "-v",
              "--json-report",
              "--json-report-file=pytest-report.json",
              "tests"
            )

            if ($env:FAILURE_DEMO -eq "true") {
              Write-Host "Failure demo enabled; adding its deliberate failing test."
              $pytestArgs += "demo_tests/test_failure_email.py"
            }

            python @pytestArgs

            $testStatus = $LASTEXITCODE

            Write-Host "Pytest exit code: $testStatus"

            if (-not (Test-Path "pytest-report.json")) {
              throw "pytest-report.json was not generated."
            }

            python scripts/build_report.py `
              --input pytest-report.json

            $reportStatus = $LASTEXITCODE

            Write-Host "Build report exit code: $reportStatus"

            if ($reportStatus -ne 0) {
              $exitStatus = $reportStatus
            }
            else {
              $exitStatus = $testStatus
            }
          }
          finally {
            if (
              $null -ne $receiver -and
              -not $receiver.HasExited
            ) {
              Stop-Process `
                -Id $receiver.Id `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host "Receiver process stopped."
            }

            if (Test-Path $receiverLog) {
              Copy-Item `
                $receiverLog `
                (Join-Path $env:GITHUB_WORKSPACE "receiver.log") `
                -Force
            }

            if (Test-Path $receiverErrorLog) {
              Copy-Item `
                $receiverErrorLog `
                (Join-Path $env:GITHUB_WORKSPACE "receiver-error.log") `
                -Force
            }
          }

          exit $exitStatus

      - name: Email test report
        if: always() && hashFiles('test-report.json') != ''
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
        shell: powershell
        run: |
          Write-Host "Sending test report email..."

          python scripts/send_email.py `
            --report test-report.json

          if ($LASTEXITCODE -ne 0) {
            throw "Email report could not be sent."
          }

          Write-Host "Email report sent successfully."

  deploy-pages:
    needs: test
    if: needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4